<!doctype html>
<html lang="pt-BR" data-composition-variables='[{"id":"kicker","type":"string","label":"Antetítulo","default":"ANÚNCIO"},{"id":"headline","type":"string","label":"Manchete","default":"O maior lançamento da década"},{"id":"sub","type":"string","label":"Frase de apoio","default":"GTA 6 muda tudo em 2026"},{"id":"accent","type":"color","label":"Cor de destaque","default":"#ff9f0a"},{"id":"name","type":"string","label":"Nome do arquivo (lote)","default":"clip"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1080px; height: 1920px; background: radial-gradient(ellipse at 50% 35%, #1d1d22 0%, #000 70%); font-family: "Inter", sans-serif; }
      #linha { position: absolute; z-index: 1; left: 150px; top: 640px; width: 120px; height: 6px; border-radius: 3px; background: var(--accent); }
      #kicker { position: absolute; z-index: 2; left: 150px; top: 580px; font-size: 34px; font-weight: 700; letter-spacing: 0.28em; color: var(--accent); }
      #headline { position: absolute; z-index: 2; left: 150px; top: 700px; width: 680px; font-size: 98px; font-weight: 900; line-height: 1.04; letter-spacing: -0.03em; color: #f5f5f7; transform-origin: left center; }
      #sub { position: absolute; z-index: 2; left: 150px; top: 1130px; width: 680px; font-size: 46px; font-weight: 400; line-height: 1.3; color: #c7c7cc; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1080" data-height="1920">
      <div id="linha"></div>
      <div id="kicker" class="clip" data-start="0" data-duration="5" data-track-index="0" data-var-text="kicker"></div>
      <div id="headline" class="clip" data-start="0" data-duration="5" data-track-index="1" data-var-text="headline"></div>
      <div id="sub" class="clip" data-start="0" data-duration="5" data-track-index="2" data-var-text="sub"></div>
    </div>
    <script>
      gsap.set("#sub", { opacity: 0 });
      const tl = gsap.timeline({ paused: true });
      // ritmo de keynote: o título já está na tela no quadro 0 e respira devagar; o apoio entra por último
      tl.fromTo("#headline", { y: 24, filter: "blur(10px)" }, { y: 0, filter: "blur(0px)", duration: 0.9, ease: "power3.out" }, 0);
      tl.fromTo("#linha", { width: 120 }, { width: 520, duration: 1.4, ease: "power2.inOut" }, 0.3);
      tl.fromTo("#sub", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.8, ease: "power2.out" }, 1.6);
      tl.fromTo("#headline", { scale: 1 }, { scale: 1.04, duration: 3, ease: "sine.inOut" }, 2);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
