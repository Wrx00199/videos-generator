<!doctype html>
<html lang="pt-BR" data-composition-variables='[{"id":"cmd","type":"string","label":"Comando","default":"curl gta6.lancamento --hoje"},{"id":"saida","type":"string","label":"Saída","default":"200 OK: trailer 3 saiu"},{"id":"headline","type":"string","label":"Manchete","default":"GTA 6 CHEGOU"},{"id":"accent","type":"color","label":"Cor de destaque","default":"#39ff88"},{"id":"name","type":"string","label":"Nome do arquivo (lote)","default":"clip"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0f14; }
      #root { position: relative; width: 1080px; height: 1920px; font-family: "JetBrains Mono", monospace; color: #d7e0ea; }
      #janela { z-index: 1; position: absolute; background-image: linear-gradient(#1a2332 0 78px, transparent 78px); left: 120px; top: 300px; width: 840px; height: 760px; border-radius: 28px; background-color: #111823; box-shadow: 0 30px 90px rgba(0,0,0,.6); }
          #cmd, #saida { position: absolute; left: 150px; white-space: nowrap; overflow: hidden; width: 0ch; font-size: 30px; }
      #cmd { top: 440px; color: #d7e0ea; }
      #cmd::before { content: "$ "; color: var(--accent); }
      #saida { top: 510px; color: #9fb3c8; }
      #manchete { position: absolute; left: 110px; width: 700px; top: 1100px; font-size: 84px; font-weight: 800; color: #fff; text-align: center; line-height: 1.05; text-shadow: 0 0 40px var(--accent); }
    #janela::before { content: ""; position: absolute; left: 34px; top: 28px; width: 22px; height: 22px; border-radius: 50%; background: #ff5f57; box-shadow: 40px 0 #febc2e, 80px 0 #28c840; }
      #janela::after { content: "estudio — zsh"; position: absolute; left: 150px; top: 0; line-height: 78px; color: #8fa0b5; font-size: 30px; }
      #cmd, #saida { z-index: 3; } #manchete { z-index: 4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1080" data-height="1920">
      <div id="janela"></div>
      <div id="cmd" class="clip" data-layout-allow-overflow data-layout-allow-occlusion data-start="0" data-duration="5" data-track-index="0" data-var-text="cmd"></div>
      <div id="saida" class="clip" data-layout-allow-overflow data-layout-allow-occlusion data-start="0" data-duration="5" data-track-index="1" data-var-text="saida"></div>
      <div id="manchete" class="clip" data-start="0" data-duration="5" data-track-index="2" data-var-text="headline"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#janela", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0);
      tl.fromTo("#cmd", { width: "0ch" }, { width: "36ch", duration: 1.2, ease: "steps(36)" }, 0.4);
      tl.fromTo("#saida", { width: "0ch" }, { width: "36ch", duration: 0.9, ease: "steps(36)" }, 1.8);
      tl.fromTo("#manchete", { scale: 1 }, { scale: 1.05, duration: 0.2, ease: "power2.out", yoyo: true, repeat: 1 }, 2.7);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
