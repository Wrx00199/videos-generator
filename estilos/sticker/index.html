<!doctype html>
<html lang="pt-BR" data-composition-variables='[{"id":"badge","type":"string","label":"Selo","default":"NOVO RECORDE"},{"id":"headline","type":"string","label":"Manchete","default":"QUEBROU A INTERNET"},{"id":"sub","type":"string","label":"Frase de apoio","default":"em menos de 24 horas no ar"},{"id":"accent","type":"color","label":"Cor do adesivo","default":"#ff3b81"},{"id":"name","type":"string","label":"Nome do arquivo (lote)","default":"clip"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #120c24; }
      #root { position: relative; width: 1080px; height: 1920px; background: radial-gradient(circle at 50% 42%, #241646 0%, #120c24 72%); font-family: "Archivo Black", sans-serif; }
      #badge { position: absolute; z-index: 3; left: 170px; top: 430px; padding: 18px 34px; border-radius: 999px; background: var(--accent); color: #ffffff; border: 10px solid #ffffff; box-shadow: 0 14px 0 #090612; font-size: 36px; letter-spacing: 0.08em; }
      #headline { position: absolute; z-index: 2; left: 150px; top: 610px; width: 610px; padding: 32px 36px; border-radius: 36px; background: #ffd60a; color: #111111; border: 14px solid #ffffff; box-shadow: 0 20px 0 #090612; font-size: 74px; line-height: 1.06; text-transform: uppercase; }
      #sub { position: absolute; z-index: 2; left: 155px; top: 1090px; width: 610px; padding: 26px 34px; border-radius: 26px; background: #ffffff; color: #120c24; border: 10px solid #120c24; box-shadow: 12px 14px 0 var(--accent); font-family: "Inter", sans-serif; font-weight: 800; font-size: 40px; line-height: 1.25; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1080" data-height="1920">
      <div id="badge" class="clip" data-start="0" data-duration="5" data-track-index="0" data-var-text="badge"></div>
      <div id="headline" class="clip" data-start="0" data-duration="5" data-track-index="1" data-var-text="headline"></div>
      <div id="sub" class="clip" data-start="0" data-duration="5" data-track-index="2" data-var-text="sub"></div>
    </div>
    <script>
      gsap.set("#sub", { opacity: 0, y: 40 });
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#badge", { rotation: -12, scale: 0.9 }, { rotation: -4, scale: 1, duration: 0.45, ease: "back.out(2.2)" }, 0);
      tl.fromTo("#headline", { rotation: 5, scale: 0.92 }, { rotation: 2, scale: 1, duration: 0.55, ease: "back.out(2)" }, 0.15);
      tl.fromTo("#sub", { opacity: 0, y: 40, rotation: -3 }, { opacity: 1, y: 0, rotation: -1.5, duration: 0.45, ease: "back.out(1.8)" }, 1.0);
      tl.to("#headline", { rotation: -1.5, duration: 1.4, ease: "sine.inOut", yoyo: true, repeat: 1 }, 1.8);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
