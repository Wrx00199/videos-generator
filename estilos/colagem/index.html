<!doctype html>
<html lang="pt-BR" data-composition-variables='[{"id":"headline","type":"string","label":"Manchete","default":"VAZOU O MAPA"},{"id":"sub","type":"string","label":"Frase de apoio","default":"dizem que tem 12 bairros novos"},{"id":"tag","type":"string","label":"Etiqueta","default":"EXCLUSIVO"},{"id":"accent","type":"color","label":"Cor da etiqueta","default":"#ff4d6d"},{"id":"name","type":"string","label":"Nome do arquivo (lote)","default":"clip"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #d9c8a3; }
      #root { position: relative; width: 1080px; height: 1920px; background-color: #d9c8a3; background-image: radial-gradient(rgba(120,90,40,.18) 2px, transparent 2px); background-size: 38px 38px; }
      .papel { position: absolute; z-index: 1; }
      #p1 { left: 70px; top: 230px; width: 760px; height: 520px; background: #f4efe3; clip-path: polygon(0 4%, 6% 0, 30% 3%, 55% 0, 80% 2%, 100% 0, 98% 30%, 100% 60%, 97% 100%, 70% 97%, 40% 100%, 15% 98%, 2% 100%, 0 70%, 3% 35%); box-shadow: 0 14px 30px rgba(0,0,0,.25); }
      #p2 { left: 150px; top: 880px; width: 760px; height: 330px; background: #2a9d8f; clip-path: polygon(0 6%, 12% 0, 45% 4%, 75% 0, 100% 5%, 97% 45%, 100% 95%, 70% 100%, 35% 96%, 8% 100%, 2% 55%); }
      #fita1 { left: 330px; top: 205px; width: 200px; height: 62px; background: rgba(255, 214, 90, .8); z-index: 2; }
      #fita2 { left: 700px; top: 850px; width: 190px; height: 58px; background: rgba(255, 214, 90, .8); z-index: 2; }
      #headline { position: absolute; z-index: 3; left: 150px; top: 330px; width: 600px; font-family: "Archivo Black", sans-serif; font-size: 100px; line-height: 1; color: #1b1b1b; text-transform: uppercase; }
      #sub { position: absolute; z-index: 3; left: 190px; top: 960px; width: 640px; font-family: "Space Mono", monospace; font-weight: 700; font-size: 44px; line-height: 1.25; color: #ffffff; }
      #tag { position: absolute; z-index: 4; left: 520px; top: 640px; padding: 14px 30px; font-family: "Archivo Black", sans-serif; font-size: 44px; color: #ffffff; background: var(--accent); box-shadow: 6px 8px 0 rgba(0,0,0,.35); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1080" data-height="1920">
      <div id="p1" class="papel"></div><div id="p2" class="papel"></div><div id="fita1" class="papel"></div><div id="fita2" class="papel"></div>
      <div id="headline" class="clip" data-start="0" data-duration="5" data-track-index="0" data-var-text="headline"></div>
      <div id="sub" class="clip" data-start="0" data-duration="5" data-track-index="1" data-var-text="sub"></div>
      <div id="tag" class="clip" data-start="0" data-duration="5" data-track-index="2" data-var-text="tag"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // stop-motion de colagem: cada pedaço entra girado e fica "tremendo" em passos de 6 fps
      gsap.set("#p1, #headline", { rotation: -3 });
      gsap.set("#p2, #sub", { rotation: 2, opacity: 0 });
      gsap.set("#fita1", { rotation: -8, opacity: 0 });
      gsap.set("#fita2", { rotation: 14, opacity: 0 });
      tl.fromTo("#p2, #sub", { y: 80, opacity: 0 }, { y: 0, opacity: 1, duration: 0.01 }, 0.5);
      tl.fromTo("#fita1, #fita2", { scale: 0.2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.2, ease: "back.out(3)" }, 0.9);
      tl.fromTo("#tag", { scale: 2.2, opacity: 0, rotation: -25 }, { scale: 1, opacity: 1, rotation: 7, duration: 0.3, ease: "back.out(2)" }, 1.3);
      for (let i = 0; i < 18; i++) {
        tl.to("#p1, #headline", { rotation: -3 + (i % 2 ? 0.8 : -0.8), duration: 0.01 }, 0.2 * i + 1.7);
        tl.to("#p2, #sub", { rotation: 2 + (i % 2 ? -0.8 : 0.8), duration: 0.01 }, 0.2 * i + 1.8);
      }
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
