<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #cv { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="50.1" data-width="1080" data-height="1920">
      <canvas id="cv" width="1080" height="1920"></canvas>
      <img id="ceuDia" src="assets/ceu_dia.png" alt="" style="display:none" />
      <img id="ceuTarde" src="assets/ceu_tarde.png" alt="" style="display:none" />
      <audio id="narracao" class="clip" src="assets/narracao.mp3" data-start="0" data-duration="49.98" data-track-index="1" data-volume="1"></audio>
      <audio id="sfx" class="clip" src="assets/sfx_mix.mp3" data-start="0" data-duration="50.1" data-track-index="2" data-volume="0.55"></audio>
    </div>
    <script src="anim.js"></script>
  </body>
</html>
